[package]
name = "gray-opencode-sub"
version = "0.1.3"
edition = "2021"
rust-version = "1.88"

[[bin]]
name = "opencode-sub"
path = "src/main.rs"

[dependencies]
gray-acp-bridge = { path = "../gray-acp-bridge" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
uuid = { version = "1", features = ["v4"] }
ureq = { version = "2", features = ["json"] }
